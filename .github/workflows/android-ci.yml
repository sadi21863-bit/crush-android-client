# Continuous integration for Crush Mobile.
#
# Runs the same gate the repo uses locally, on every push and pull request:
# the full JVM unit-test suite plus the debug APK build. README documents the
# gate as `./gradlew :app:testDebugUnitTest :app:assembleRelease`; CI builds
# assembleDebug (the artifact users install from source) so the two checks
# cover both configurations:
#   - testDebugUnitTest: every pinned defect has a test, so a green CI run
#     means the regressions the suites caught stay caught.
#
# One property to keep in mind when reading a green CI run: the engine binary
# (app/src/main/jniLibs/arm64-v8a/libcrush.so) is deliberately gitignored,
# so CI checkouts build a **gate APK without the embedded engine binary**.
# CI proves the code compiles and the logic suites pass; runtime behavior is
# still verified on real arm64 hardware locally, same as before the workflow
# existed. See README ("Fetching the engine") for that contract.
#
# MODE-25 (docs/crush-plan-2026-11-02.md §"CI reports engine-less compile
# gate vs engine-included device gate"): every run attaches a PROVENANCE
# MANIFEST (also a downloadable artifact) that reports which certification
# profile this run represents - engine-less compile gate vs engine-included
# artifact - measured from the checkout itself (not assumed), including the
# debug APK's sha256. A green manifest row therefore says "these exact bytes
# passed compile + JVM suites + lint", and says plainly that this is NOT
# on-device runtime proof; the device gate's measured evidence lives in
# docs/capabilities.md and the docs ledger.

name: android-ci

on:
  push:
    # Every branch push fired a full gate run, which made the closed
    # v099-experiment evidence lane go red forever (it predates the wrapper
    # fix). Push builds belong on main; any branch's changes still get
    # gate runs the moment they open a pull request.
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        # The newer ubuntu runner images no longer ship a preinstalled
        # Android SDK, and android-actions/setup-android@v3 failed on the
        # migrated image (measured 2026-11-01). This provisions directly
        # from Google's commandline-tools and lets AGP fetch the platform/
        # build-tools it needs once licenses are accepted.
        run: |
          set -e
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          unzip -q /tmp/clt.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses > /dev/null
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "sdk.dir=$HOME/android-sdk" > local.properties

      - name: Cache the Gradle toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'app/build.gradle.kts') }}
          restore-keys: gradle-

      - name: Gate - JVM tests, debug APK, androidTest assembly, and release lint
        # lintRelease: full static analysis with the 2026-10-31 waivers
        # (app/lint.xml, each entry dated). Errors fail the build.
        # assembleDebugAndroidTest: compile-only (no emulator) proof that the
        # instrumented suites stay buildable on every push.
        id: gate
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease --console=plain 2>&1 | tee gate-output.log

      - name: Publish the gate failure as annotations
        # The job log endpoint needs repo admin, which pushed credentials do
        # not have (measured: HTTP 403 "Must have admin rights"). The
        # check-run annotations endpoint, however, is publicly readable — so
        # printf the head and tail of the gradle output through ::error:: to
        # make the failure self-describing without any log download.
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          dump() {
            max=$1; shift
            while IFS= read -r line; do
              # Cap each line so annotations stay within the 4 KB message budget.
              printf '::error::%s\n' "${line:0:250}"
            done < <(head -n "$max" gate-output.log)
          }
          echo "=== gradle output: FIRST 12 lines (launcher errors live here) ==="
          dump 12
          echo "=== gradle output: LAST 28 lines (the real error lives here) ==="
          while IFS= read -r line; do
            printf '::error::%s\n' "${line:0:250}"
          done < <(tail -n 28 gate-output.log)
          echo "=== launcher facts ==="
          printf '::error::JAVA_HOME=%s\n' "$JAVA_HOME"
          printf '::error::gradle-wrapper.jar size: %s bytes\n' "$(stat -c%s gradle/wrapper/gradle-wrapper.jar 2>/dev/null || echo MISSING)"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/**
            app/build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Build the provenance manifest (MODE-25)
        # Distinguish the two certification profiles a run can represent,
        # measured from THIS checkout rather than assumed:
        #   engine-LESS  = compile gate. The engine binary is gitignored and
        #                  never reaches CI, so the APK assembled here cannot
        #                  exec the engine. The run proves code compiles, JVM
        #                  suites pass, androidTest compiles, lint is green.
        #   engine-IN    = engine-included artifact (full runtime candidate),
        #                  only possible if the blob is vendored into the
        #                  checkout; on-device behavior remains the device
        #                  gate, run on real arm64 hardware locally.
        # Runs always() so even a failed run is self-describing: its manifest
        # still names what the checkout contained and whether an APK exists.
        if: always()
        run: |
          set -e
          out="provenance-manifest-${{ github.run_id }}.md"
          engine="app/src/main/jniLibs/arm64-v8a/libcrush.so"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          {
            echo "# Build provenance - Crush Mobile (run ${{ github.run_id }}, ${{ github.event_name }})"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| git_sha | $(git rev-parse HEAD) |"
            echo "| gate_tasks | :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease |"
            if [ -f "$engine" ]; then
              echo "| engine_blob | PRESENT - sha256 $(sha256sum "$engine" | cut -d' ' -f1), $(stat -c%s "$engine") bytes |"
              echo "| certifies | ENGINE-INCLUDED artifact; on-device behavior is the remaining gate (device gate: real arm64 hardware, evidence in docs) |"
            else
              echo "| engine_blob | ABSENT (deliberately gitignored; see README 'Fetching the engine') |"
              echo "| certifies | ENGINE-LESS compile gate - compiles + JVM suites + lint. This APK cannot exec the engine; it is NOT runtime proof |"
            fi
            if [ -f "$apk" ]; then
              echo "| debug_apk | sha256 $(sha256sum "$apk" | cut -d' ' -f1), $(stat -c%s "$apk") bytes |"
            else
              echo "| debug_apk | not produced (gate failed before assembly) |"
            fi
            echo ""
            echo "Engine-included device-gate evidence is measured on real arm64 hardware and recorded in docs/capabilities.md and the docs ledger."
          } > "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the provenance manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provenance-manifest-${{ github.run_id }}
          path: provenance-manifest-*.md
          if-no-files-found: warn
          retention-days: 14
