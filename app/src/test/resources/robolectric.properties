# Phase 2b.1 (V2 plan §6.2/§6.3): the Compose tests need the merged
# manifest/resources so `createComposeRule()` can resolve the ComponentActivity
# that `ui-test-manifest` contributes (app/build.gradle.kts enables
# `unitTests.isIncludeAndroidResources`).
#
# That switch also makes Robolectric honor the production manifest's
# `android:name=".CrushMobileApp"`. These are unit tests: none of them needs
# the real AppContainer, and constructing it (DataStore, supervisor scaffolding,
# engine paths) is exactly the host work the content seam exists to keep out.
# Pinning plain Application keeps the pre-2b.1 Robolectric behaviour for every
# existing test while the manifest still supplies activities and a theme.
application=android.app.Application
