# JVM args only. The JDK is NOT pinned here: Gradle 9.8 runs on JVM 17-27 and
# Android Studio supplies its own JDK (currently 25). If you build from a shell
# with no JAVA_HOME set, point JAVA_HOME at a JDK 17+.
# Tuned for THIS machine, not a generic one.
#
# Measured: AMD A9-9420, 2 cores / 2 threads @3.0GHz, 7.5GB RAM with only
# ~1.1GB free. Under those conditions the default Gradle setup is actively
# harmful:
#   - parallel workers thrash 2 cores and thrash the page file
#   - a 3GB heap on a box with 1.1GB free forces heavy swapping
#   - in-process Kotlin compilation makes the compiler compete with Gradle for
#     the same 2 cores inside the same starved JVM
# Measured on this box: no-op rebuild ~1m55s, 1-file change ~4m17s.
#
# If you build on a machine with >=8 cores and >=16GB free, raise these back:
#   org.gradle.parallel=true
#   org.gradle.jvmargs=-Xmx3072m ...
#   kotlin.compiler.execution.strategy=in-process
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
# Out-of-process Kotlin compilation uses its own JVM sized independently of
# Gradle's, which measurably beats in-process when memory is the constraint.
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx1024m
kotlin.incremental=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Opt out of AGP 9's built-in Kotlin so the project can own the Kotlin Gradle
# Plugin version directly (currently 2.4.10, the current stable line).
#
# AGP 9 otherwise pins KGP to its own tested version and a buildscript classpath
# override puts a SECOND KGP on the classpath, which corrupts in-process
# compilation and fails with a misleading:
#   "Unexpected lock protocol found in lock file. Expected 3, found 0."
#
# Cost of this opt-out: AGP 10 removes it entirely, so this must be undone before
# upgrading to AGP 10. See docs/toolchain.md.
android.builtInKotlin=false

# AGP 9's new DSL is incompatible with the classic kotlin.android plugin, which is
# the only way to pin a KGP newer than AGP's bundled 2.2.10. Kotlin's own error
# message offers this bypass. It is explicitly documented as TEMPORARY.
android.newDsl=false
